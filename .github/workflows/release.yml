name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            qt6-base-dev \
            qt6-declarative-dev \
            libqt6quickcontrols2-6 \
            libgtest-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          mkdir -p "release/predator-rgb-${VERSION}-linux-x86_64"
          cp build/app/predator-rgb "release/predator-rgb-${VERSION}-linux-x86_64/"
          cp README.md LICENSE MANUAL.md "release/predator-rgb-${VERSION}-linux-x86_64/"
          tar -czf "release/predator-rgb-${VERSION}-linux-x86_64.tar.gz" -C release "predator-rgb-${VERSION}-linux-x86_64"

      - name: Generate checksums
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: release
        run: |
          sha256sum predator-rgb-*-linux-x86_64.tar.gz > SHA256SUMS.txt
          echo "## SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/predator-rgb-*-linux-x86_64.tar.gz
            release/SHA256SUMS.txt
          generate_release_notes: true
